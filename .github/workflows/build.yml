name: Build
on:
  push:
    paths:
      - '**.4dm'
  pull_request:
    paths:
      - '**.4dm'
  workflow_dispatch:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Check out ArcanoidGame
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/ArcanoidGame
        path: Components/ArcanoidGame.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out 2048
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/2048
        path: Components/2048.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out Taquin
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Taquin
        path: Components/Taquin.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out Puissance4D
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Puissance4D
        path: Components/Puissance4D.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out Memory4D
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Memory4D
        path: Components/Memory4D.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out EscapingButton
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/EscapingButton
        path: Components/EscapingButton.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out ActivityIndicator
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/ActivityIndicator
        path: Components/ActivityIndicator.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out MatrixRain
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/MatrixRain
        path: Components/MatrixRain.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out Hero
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Hero
        path: Components/Hero.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out Toast
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Toast
        path: Components/Toast.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out SegmentedControl
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/SegmentedControl
        path: Components/SegmentedControl.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out FlipList
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/FlipList
        path: Components/FlipList.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out Confetti
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Confetti
        path: Components/Confetti.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out ToggleSwitch
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/ToggleSwitch
        path: Components/ToggleSwitch.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out Badge
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Badge
        path: Components/Badge.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out Stepper
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/Stepper
        path: Components/Stepper.4dbase
        ref: main
        fetch-depth: 0
    - name: Build
      uses: 4d/build4d-action@main
