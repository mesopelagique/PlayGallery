name: Build
on:
  push:
    paths:
      - '**.4dm'
  pull_request:
    paths:
      - '**.4dm'
  workflow_dispatch:

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Check out ArcanoidGame
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/ArcanoidGame
        path: Components/ArcanoidGame.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out 2048
      uses: actions/checkout@v5
      with:
        repository: mesopelagique/2048
        path: Components/2048.4dbase
        ref: main
        fetch-depth: 0
    - name: Check out Taquin
